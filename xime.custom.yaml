                                #PC快捷操作布局
                
#经典PC端快捷操作复刻上滑如下：
# A 全选
# Z 撤回
# B 回车
# N 重复上次操作
#    X、     C、      V 
#  [剪切]、 [复制]、 [粘贴]

                #中英键盘说明
#空格为语音面板改居中缩小，左右各加光标控制
#逗号与句号合并 单击逗号 上滑句号
#逗号句号放在左边，中英切换放在右边
#中英文输入QWERPD上滑符号均为英标符
#中文状态上下滑P对应 ：运算符 + -
#中文状态上滑   对应 ：运算符 =
#中英状态上下滑M  分别对应各自中英符 ! ? 
#英文状态适配常用命令符
                #数字键盘说明
#将数字面板改为二级页面绕过并屏蔽掉了二级的符号
#左边处 + - * / 外多加@
#将空格键居中以适应多数人习惯
#符号与表情一起放在右边

metadata:
  app_name: Xime
  app_version: ">=2.3.0"
  platform: android
  config_version: 1

keyboard:
  # ─ 中文键盘 ─
  qwerty:
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, period, cursor_left, voice,cursor_right, earth, enter]

    keys:
      # ── 第1行 : 字母 ──
      q: { tap: "q", long_press: { values: ["Q"] }, swipe_up: "#" }
      w: { tap: "w", long_press: { values: ["W"] }, swipe_up: "@" }
      e: { tap: "e", long_press: { values: ["E"] }, swipe_up: "*" }
      r: { tap: "r", long_press: { values: ["R"] }, swipe_up: "/" }
      t: { tap: "t", long_press: { values: ["T"] }, swipe_up: "《" }
      y: { tap: "y", long_press: { values: ["Y"] }, swipe_up: "》" }
      u: { tap: "u", long_press: { values: ["U"] }, swipe_up: "（" }
      i: { tap: "i", long_press: { values: ["I"] }, swipe_up: "）" }
      o: { tap: "o", long_press: { values: ["O"] }, swipe_up: "—" ,swipe_down:  "_" }
      p: { tap: "p", long_press: { values: ["P"] }, swipe_up: "+",swipe_down:  "-" }

      # ── 第2行 : 字母 ──
      a:
        {
          tap: "a",
          long_press: { values: ["A"] },
          swipe_up: { action: select_all , label: "▣" },
          swipe_down: { display: "bubble", action: select_all , label: "▣" }
        }
      s: { tap: "s", long_press: { values: ["S"] }, swipe_up: "%"}
      d: { tap: "d", long_press: { values: ["D"] }, swipe_up: "=" }
      f: { tap: "f", long_press: { values: ["F"] }, swipe_up: "、" }
      g: { tap: "g", long_press: { values: ["G"] }, swipe_up: "～" }
      h: { tap: "h", long_press: { values: ["H"] }, swipe_up: "；" }
      j: { tap: "j", long_press: { values: ["J"] }, swipe_up: "：" }
      k: { tap: "k", long_press: { values: ["K"] }, swipe_up: "“" }
      l: { tap: "l", long_press: { values: ["L"] }, swipe_up: "”" }

      # ── 第3行 : 字母 ──
      z:
        {
          tap: "z",
          long_press: { values: ["Z"] },
          swipe_up: { action: undo, label: "↩" },
          swipe_down: { display: "bubble", action: undo, label: "↩" }
        }
      x:
        {
          tap: "x",
          long_press: { values: ["X"] },
          swipe_up: { action: cut, label: "✂" },
          swipe_down: { display: "bubble", action: cut, label: "✂" }
        }
      c:
        {
          tap: "c",
          long_press: { values: ["C", "℃"] },
          swipe_up: { action: copy, label: "❐" },
          swipe_down: { display: "bubble", action: copy, label: "❐" }
        }
      v:
        {
          tap: "v",
          long_press: { values: ["V"] },
          swipe_up: { action: paste, label: "☑" },
          swipe_down: { display: "bubble", action: paste, label: "☑" }
        }
        
      b:
        {
          tap: "b",
          long_press: { values: ["B"] },
          swipe_up: { action: newline, label: "↵" },
          swipe_down: { display: "bubble", action: newline, label: "↵" }
        }
      n:
        {
          tap: "n",
          long_press: { values: ["N"] },
          swipe_up: { label: "⊕", action: repeat },
          swipe_down: { display: "bubble", label: "⊕", action: repeat }
        }
      m: { tap: "m", long_press: { values: ["M"] }, swipe_up:  "？",swipe_down: "！" }
      # ── 第4行 : 特殊 ──
      #切面板
      mode_change: {width:1.8, tap: { action: command, value: mode_change_number }}
      #句号
      period: { width: 0.8, tap: { label: "⊙", value: "，" }, swipe_up: "。" }
      #语音改空格
      voice:
        {
          width: 1.5,
          tap: { action: space },
          long_press: { values: [ { action: none } ] },
          swipe_up: { label: "，", value: "," },
          swipe_down: { label: "。", value: "." }
        }
      # 语言
      earth:  { width:0.8, tap: { label: "∞", action: "toggle_ascii" } }
      
#分隔线——————————————————————————————————————————————


  # ── 英文键盘 ──
  qwerty_en:
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, period, cursor_left, voice,cursor_right, earth, enter]

    keys:
      # ── 第1行 : 字母 ──
      q: { tap: "q", long_press: { values: ["Q"] }, swipe_up: "#" }
      w: { tap: "w", long_press: { values: ["W"] }, swipe_up: "@" }
      e: { tap: "e", long_press: { values: ["E"] }, swipe_up: "*" }
      r: { tap: "r", long_press: { values: ["R"] }, swipe_up: "/" }
      t: { tap: "t", long_press: { values: ["T"] }, swipe_up: "{" }
      y: { tap: "y", long_press: { values: ["Y"] }, swipe_up: "}" }
      u: { tap: "u", long_press: { values: ["U"] }, swipe_up: "(" }
      i: { tap: "i", long_press: { values: ["I"] }, swipe_up: ")" }
      o: { tap: "o", long_press: { values: ["O"] }, swipe_up: "<",swipe_down: "_" }
      p: { tap: "p", long_press: { values: ["P"] }, swipe_up: ">" }

      # ── 第2行 : 字母 ──
      a:
        {
          tap: "a",
          long_press: { values: ["A"] },
          swipe_up: { action: select_all , label: "▣" },
          swipe_down: { display: "bubble", action: select_all , label: "▣" }
        }
      s:
       { tap: "s", long_press: { values: ["S"] }, swipe_up: "&" }
      d: { tap: "d", long_press: { values: ["D"] }, swipe_up: "≈" }
      f: { tap: "f", long_press: { values: ["F"] }, swipe_up: "\\" }
      g: { tap: "g", long_press: { values: ["G"] }, swipe_up: "~" }
      h: { tap: "h", long_press: { values: ["H"] }, swipe_up: ";" }
      j: { tap: "j", long_press: { values: ["J"] }, swipe_up: ":" }
      k: { tap: "k", long_press: { values: ["K"] }, swipe_up: "\"" }
      l: { tap: "l", long_press: { values: ["L"] }, swipe_up: "%" }

      # ── 第3行 : 字母 ──
      z:
        {
          tap: "z",
          long_press: { values: ["Z"] },
          swipe_up: { action: undo, label: "↩" },
          swipe_down: { display: "bubble", action: undo, label: "↩" }
        }
      x:
        {
          tap: "x",
          long_press: { values: ["X"] },
          swipe_up: { action: cut, label: "✂" },
          swipe_down: { display: "bubble", action: cut, label: "✂" }
        }
      c:
        {
          tap: "c",
          long_press: { values: ["C", "℃"] },
          swipe_up: { action: copy, label: "❐" },
          swipe_down: { display: "bubble", action: copy, label: "❐" }
        }
      v:
        {
          tap: "v",
          long_press: { values: ["V"] },
          swipe_up: { action: paste, label: "☑" },
          swipe_down: { display: "bubble", action: paste, label: "☑" }
        }
        
      b:
        {
          tap: "b",
          long_press: { values: ["B"] },
          swipe_up: { action: newline, label: "↵" },
          swipe_down: { display: "bubble", action: newline, label: "↵" }
        }
      n:
        {
          tap: "n",
          long_press: { values: ["N"] },
          swipe_up: { label: "⊕", action: repeat },
          swipe_down: { display: "bubble", label: "⊕", action: repeat }
        }
      m: { tap: "m", long_press: { values: ["M"] }, swipe_up:  "?",swipe_down: "!" }

      # ── 第4行 : 特殊 ──
      #切面板
      mode_change: {width:1.8, tap: { action: command, value: mode_change_number }}
      #句号
      period: { width: 0.8, tap: { label: "⊙", value: "," }, swipe_up: "·" }
      #语音改空格
      voice:
        {
          width: 1.5,
          tap: { action: space },
          long_press: { values: [ { action: none } ] },
          swipe_up: { label: "，", value: "," },
          swipe_down: { label: "。", value: "." }
        }
      # 语言
      earth:  { width:0.8, tap: { label: "∞", action: "toggle_ascii" } }
#数字符号键盘
  number:
    type: columns
    layout:
      left:
        - ["+", "-", "*", "/","@"]
        - back
      rows:
        - [1, 2, 3]
        - [4, 5, 6]
        - [7, 8, 9]
        - [ 0, space_bar,"."]
      right: [delete, open_symbols, emoji, enter]
      